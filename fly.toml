# fly.toml app configuration file generated for kinfire-gateway-garrett on 2026-09-12T12:53:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kinfire-gateway-garrett'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
