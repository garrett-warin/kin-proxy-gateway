<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kin — Approval preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>:root{--bg:#111214;--panel:#1b1c20;--line:#383a40;--text:#f5f1eb;--muted:#929499;--orange:#f3a04b}*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:"DM Sans",Arial,sans-serif}.card{width:min(92vw,430px);padding:34px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}.mark{width:58px;height:58px;object-fit:contain;margin-bottom:18px}.eyebrow{margin:0 0 9px;color:var(--orange);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:25px}p{margin:13px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.state-icon{width:42px;height:42px;display:grid;place-items:center;margin:22px auto 0;border:1px solid var(--line);border-radius:50%;color:var(--orange);font-size:20px}.note{position:fixed;top:18px;left:18px;color:var(--muted);font-size:12px}.note a{color:#d7b089}</style>
</head>
<body>
  <div class="note">Preview only · <a href="/">Back to Kin</a></div>
  <main class="card">
    <img class="mark" src="/kin-mark-tab.png" alt="Kin">
    <p class="eyebrow">FCPS access</p>
    <h1>Waiting for approval</h1>
    <p>Your FCPS identity is verified. An administrator still needs to approve your Kin account.</p>
    <div class="state-icon">…</div>
  </main>
</body>
</html>
