<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b1c20" />
  <title>Kin</title>
  <link rel="icon" href="/kin-mark-tab.png" />
  <link rel="stylesheet" href="/index.css" />
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/register-sw.js" defer></script>
  <script src="/search.js" defer></script>
  <script src="/index.js" defer></script>
</head>
<body>
  <div class="browser-shell">
    <header class="browser-chrome">
      <div class="tab-strip">
        <a class="brand-mark" href="/" aria-label="Kin home"><img src="/kin-mark-tab.png" alt="" /></a>
        <div id="tabs" class="tabs" role="tablist">
          <button class="tab active" data-view="home" role="tab"><img src="/kin-mark-tab.png" alt="" /><span>New tab</span><i>×</i></button>
          <button class="tab" data-view="bookmarks" role="tab"><span class="bookmark-glyph">◇</span><span>Bookmarks</span><i>×</i></button>
          <button id="new-tab" class="new-tab" aria-label="New tab">+</button>
        </div>
        <div class="window-buttons" aria-hidden="true"><span>—</span><span>□</span><span>×</span></div>
      </div>
      <div class="toolbar">
        <button id="back" class="tool" aria-label="Back">‹</button>
        <button id="forward" class="tool" aria-label="Forward">›</button>
        <button id="reload" class="tool reload" aria-label="Reload">↻</button>
        <form id="sj-form" class="omnibox">
          <span class="search-icon">⌕</span>
          <input id="sj-address" autocomplete="off" placeholder="Search or enter an address" aria-label="Search or enter an address" />
          <input id="sj-search-engine" value="https://www.bing.com/search?q=%s" type="hidden" />
          <span class="verified">Kin</span>
        </form>
        <a class="admin-link" style="height:32px;display:inline-flex;align-items:center;border:1px solid #474950;border-radius:8px;padding:0 10px;color:#c8aa87;text-decoration:none;font-size:12px;font-weight:700" href="https://script.google.com/a/macros/fcpsschools.net/s/AKfycbw6cusU0GMU3G1aw69gavCCOShiBXZ_W-cXG8Wo7s8i0PNTJaf2Th6LwNwj5oEfVSXf/exec?admin=1" target="_blank" rel="noopener">Admin</a>
        <button id="settings-button" class="tool" aria-label="Preferences">⚙</button>
      </div>
    </header>

    <main id="start-page" class="start-page">
      <section id="home-view" class="view active">
        <div class="hero">
          <img class="wordmark" src="/kin-wordmark.png" alt="Kin" />
          <p>A quieter way to explore.</p>
          <form id="home-form" class="home-search">
            <span>⌕</span>
            <input id="home-address" autocomplete="off" placeholder="Search with Bing or enter an address" aria-label="Search the web" />
            <button type="submit">Go</button>
          </form>
          <div class="hero-meta"><span id="engine-label">Bing</span><i></i><span>FCPS verified</span><i></i><span>Private session</span></div>
        </div>
        <section class="quick-access">
          <div class="section-title"><div><small>Your space</small><h2>Quick access</h2></div><button id="add-bookmark">+ Add bookmark</button></div>
          <div id="bookmark-grid" class="bookmark-grid"></div>
        </section>
      </section>

      <section id="bookmarks-view" class="view bookmarks-view">
        <div class="page-title"><div><small>Your space</small><h1>Bookmarks</h1><p>Your favorite corners of the web, saved on this device.</p></div><button id="add-bookmark-page" class="primary">+ Add bookmark</button></div>
        <div id="all-bookmarks" class="bookmark-grid"></div>
      </section>

      <section id="frame-host" class="frame-host" aria-live="polite"></section>
      <div id="sj-error" class="error" role="alert"></div>
      <pre id="sj-error-code" hidden></pre>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <section id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header><div><small>Kin</small><h2 id="settings-title">Preferences</h2></div><button class="close-modal" aria-label="Close">×</button></header>
      <label class="field"><span>Search engine</span><select id="engine-select"><option value="bing">Bing</option><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="brave">Brave Search</option></select></label>
      <label class="toggle-row"><span><b>Show starter bookmarks</b><small>Display Kin's suggested shortcuts.</small></span><input id="show-starters" type="checkbox" checked /></label>
    </section>
    <form id="bookmark-modal" class="modal hidden" role="dialog" aria-modal="true">
      <header><div><small>Quick access</small><h2>Add bookmark</h2></div><button type="button" class="close-modal" aria-label="Close">×</button></header>
      <label class="field"><span>Name</span><input id="bookmark-name" maxlength="50" required placeholder="School portal" /></label>
      <label class="field"><span>Address</span><input id="bookmark-url" required placeholder="example.com" /></label>
      <div class="modal-actions"><button type="button" class="close-modal quiet">Cancel</button><button class="primary" type="submit">Save bookmark</button></div>
    </form>
  </div>
</body>
</html>
